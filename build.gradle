plugins {
    id 'dev.architectury.loom-no-remap' version '1.17-SNAPSHOT' apply false
    id 'architectury-plugin' version '3.5-SNAPSHOT'
    id 'com.gradleup.shadow' version '8.3.6' apply false
    id "me.modmuss50.mod-publish-plugin" version "2.2.0"
}

architectury {
    minecraft = project.minecraft_version
}

allprojects {
    group = rootProject.maven_group
    version = "$rootProject.mod_version+$rootProject.minecraft_version"
}

subprojects {
    apply plugin: 'dev.architectury.loom-no-remap'
    apply plugin: 'architectury-plugin'
    apply plugin: 'maven-publish'
    base {
        archivesName = "$rootProject.archives_name-$project.name"
    }
    repositories {
        mavenLocal()
        maven { url "https://maven.shedaniel.me/" }
        maven { url "https://maven.terraformersmc.com/releases/" }
        maven { url "https://maven.ladysnake.org/releases/" }
        maven { url "https://maven.ladysnake.org/snapshots/" }
        maven { url "https://maven.nucleoid.xyz/releases" }
        maven { url "https://maven.theillusivec4.top/" }
        maven { url "https://maven.jamieswhiteshirt.com/libs-release/" }
        maven { url "https://raw.githubusercontent.com/fuzss/modresources/main/maven/" }
        maven {
            url "https://maven.cafeteria.dev/"
            content {
                includeGroup "net.adriantodt.fabricmc"
            }
        }
        exclusiveContent {
            forRepository {
                maven { url "https://api.modrinth.com/maven/" }
            }
            filter {
                includeGroup "maven.modrinth"
            }
        }
        maven { url "https://maven.caffeinemc.net/releases" }
        maven { url "https://maven.su5ed.dev/releases" }
        maven { url "https://maven.fabricmc.net/" }
        maven { url "https://maven.quiltmc.org/repository/release/" }
        maven { url "https://jitpack.io/" }
    }
    dependencies {
        minecraft "net.minecraft:minecraft:$rootProject.minecraft_version"
    }
    java {
        withSourcesJar()
        sourceCompatibility = JavaVersion.VERSION_25
        targetCompatibility = JavaVersion.VERSION_25
    }
    tasks.withType(JavaCompile).configureEach {
        it.options.release = 25
    }
    publishing {
        publications {
            mavenJava(MavenPublication) {
                artifactId = base.archivesName.get()
                from components.java
            }
        }
        repositories {
        }
    }
}

publishMods {
    changelog = ""
    type = STABLE
    def mrOptions = modrinthOptions {
        accessToken = providers.environmentVariable("MODRINTH_TOKEN")
        minecraftVersions.add(project.minecraft_version)
        environment = CLIENT_AND_SERVER
        projectId = "ORiydwz3"
        requires("architectury-api")
        optional("cloth-config")
    }
    def cfOptions = curseforgeOptions {
        accessToken = providers.environmentVariable("CURSEFORGE_TOKEN")
        minecraftVersions.add(project.minecraft_version)
        requires("architectury-api")
        optional("cloth-config")
    }
    modrinth("modrinthFabric") {
        from mrOptions
        file project(":fabric")
        modLoaders.add("fabric")
        displayName = "Mermod ${project.mod_version} [Fabric ${project.minecraft_version}]"
        version = "${project.mod_version}-fabric+${project.minecraft_version}"
        requires("fabric-api")
        optional("trinkets-updated")
    }
    modrinth("modrinthNeoForge") {
        from mrOptions
        file project(":neoforge")
        modLoaders.add("neoforge")
        displayName = "Mermod ${project.mod_version} [NeoForge ${project.minecraft_version}]"
        version = "${project.mod_version}-neoforge+${project.minecraft_version}"
        optional("curios")
    }
    curseforge("curseforgeFabric") {
        from cfOptions
        file project(":fabric")
        modLoaders.add("fabric")
        projectId = "463248"
        projectSlug = "mermod-fabric"
        displayName = "Mermod ${project.mod_version} [Fabric ${project.minecraft_version}]"
        requires("fabric-api")
        optional("trinkets-updated")
    }
    curseforge("curseforgeNeoForge") {
        from cfOptions
        file project(":neoforge")
        modLoaders.add("neoforge")
        projectId = "709092"
        projectSlug = "mermod-neoforge"
        displayName = "Mermod ${project.mod_version} [NeoForge ${project.minecraft_version}]"
        optional("curios")
    }
}