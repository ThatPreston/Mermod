architectury {
    common rootProject.enabled_platforms.split(',')
}

dependencies {
    implementation "net.fabricmc:fabric-loader:$rootProject.fabric_loader_version"
    api "dev.architectury:architectury:$rootProject.architectury_api_version"
    api "fuzs.forgeconfigapiport:forgeconfigapiport-common-neoforgeapi:$rootProject.fcap_version"
    compileOnly "me.shedaniel.cloth:cloth-config:$rootProject.cloth_config_version"
}