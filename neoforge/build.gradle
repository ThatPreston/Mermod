plugins {
    id 'com.gradleup.shadow'
}

architectury {
    platformSetupLoomIde()
    neoForge()
}

configurations {
    common {
        canBeResolved = true
        canBeConsumed = false
    }
    compileClasspath.extendsFrom common
    runtimeClasspath.extendsFrom common
    developmentNeoForge.extendsFrom common
    shadowBundle {
        canBeResolved = true
        canBeConsumed = false
    }
}

repositories {
    maven { url "https://maven.neoforged.net/releases" }
}

dependencies {
    neoForge "net.neoforged:neoforge:$rootProject.neoforge_version"
    modImplementation "dev.architectury:architectury-neoforge:$rootProject.architectury_api_version"
    modImplementation "top.theillusivec4.curios:curios-neoforge:$rootProject.curios_version"
    modImplementation "io.wispforest:accessories-neoforge:$rootProject.accessories_version"
    modImplementation "io.wispforest:owo-lib-neoforge:$rootProject.owo_neoforge_version"
    forgeRuntimeLibrary "blue.endless:jankson:1.2.2"
    forgeRuntimeLibrary "io.wispforest:endec:0.1.9"
    forgeRuntimeLibrary "io.wispforest.endec:gson:0.1.6"
    forgeRuntimeLibrary "io.wispforest.endec:jankson:0.1.6"
    forgeRuntimeLibrary "io.wispforest.endec:netty:0.1.5"
    modImplementation "org.figuramc:figura-neoforge:$rootProject.figura_version"
    forgeRuntimeLibrary "com.github.FiguraMC.luaj:luaj-core:$rootProject.luaj_version-figura"
    forgeRuntimeLibrary "com.github.FiguraMC.luaj:luaj-jse:$rootProject.luaj_version-figura"
    forgeRuntimeLibrary "com.neovisionaries:nv-websocket-client:$rootProject.nv_websocket_version"
    modImplementation "me.shedaniel.cloth:cloth-config-neoforge:$rootProject.cloth_config_version"
    common(project(path: ':common', configuration: 'namedElements')) { transitive = false }
    shadowBundle project(path: ':common', configuration: 'transformProductionNeoForge')
}

processResources {
    var replaceProperties = [
            mod_id: mod_id,
            mod_version: mod_version,
            mod_name: mod_name,
            mod_description: mod_description,
            mod_license: mod_license,
            neoforge_version_range: neoforge_version_range,
            neoforge_loader_version_range: neoforge_loader_version_range,
            minecraft_version_range: minecraft_version_range,
            architectury_api_version: architectury_api_version
    ]
    inputs.properties replaceProperties
    filesMatching("META-INF/neoforge.mods.toml") {
        expand replaceProperties + [project: project]
    }
}

shadowJar {
    configurations = [project.configurations.shadowBundle]
    archiveClassifier = 'dev-shadow'
}

remapJar {
    inputFile.set shadowJar.archiveFile
}